<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solaio - Inventario Dispensa</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C1B19">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#1C1B19; --surface:#242219; --surface-2:#2C2A20;
    --accent:#D6A419; --accent-dim:#8f7014; --danger:#C1502E; --danger-dim:#8a3a20;
    --text:#F1EDE4; --text-muted:#9C9689; --border:#3A362C;
    --radius:12px; --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100%;overscroll-behavior:none;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:520px;margin:0 auto;position:relative;}

  header{padding:18px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .bars{display:flex;gap:2px;align-items:flex-end;height:22px;}
  .bars span{display:block;width:3px;background:var(--accent);}
  .bars span:nth-child(1){height:60%}.bars span:nth-child(2){height:100%}.bars span:nth-child(3){height:45%}
  .bars span:nth-child(4){height:85%}.bars span:nth-child(5){height:55%}
  header h1{font-size:18px;letter-spacing:.04em;text-transform:uppercase;}
  header .sub{font-size:11px;color:var(--text-muted);margin-top:2px;}

  main{flex:1;overflow-y:auto;padding:16px 16px calc(90px + var(--safe-bottom));}
  .view{display:none;} .view.active{display:block;}

  /* Scan view */
  .scan-hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 20px;text-align:center;margin-bottom:16px;}
  .mode-toggle{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;margin:0 auto 20px;width:fit-content;border:1px solid var(--border);}
  .mode-toggle button{border:none;background:transparent;color:var(--text-muted);font-family:'Space Grotesk';font-weight:600;font-size:13px;padding:9px 18px;border-radius:999px;cursor:pointer;letter-spacing:.03em;}
  .mode-toggle button.active.carico{background:var(--accent);color:#1C1B19;}
  .mode-toggle button.active.scarico{background:var(--danger);color:#F1EDE4;}
  .scan-btn{width:100%;padding:18px;border-radius:var(--radius);border:none;font-family:'Space Grotesk';font-weight:600;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;}
  .scan-btn.carico{background:var(--accent);color:#1C1B19;}
  .scan-btn.scarico{background:var(--danger);color:#F1EDE4;}
  .manual-link{display:block;text-align:center;margin-top:14px;color:var(--text-muted);font-size:13px;background:none;border:none;text-decoration:underline;cursor:pointer;width:100%;}

  .stats-row{display:flex;gap:10px;margin-bottom:16px;}
  .stat-card{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
  .stat-card .n{font-family:'JetBrains Mono';font-size:22px;font-weight:700;color:var(--accent);}
  .stat-card .l{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}

  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin:20px 0 10px;}

  /* Product tag card - signature element */
  .tag-card{position:relative;display:flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:10px;cursor:pointer;}
  .tag-card .photo{width:64px;height:64px;flex-shrink:0;background:var(--surface-2);object-fit:cover;}
  .tag-card .photo-ph{width:64px;height:64px;flex-shrink:0;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:20px;}
  .tag-card .divider{width:0;border-left:1.5px dashed var(--border);position:relative;margin:8px 0;}
  .tag-card .divider::before,.tag-card .divider::after{content:'';position:absolute;left:-6px;width:12px;height:12px;border-radius:50%;background:var(--bg);}
  .tag-card .divider::before{top:-8px;} .tag-card .divider::after{bottom:-8px;}
  .tag-card .info{flex:1;padding:10px 12px;min-width:0;}
  .tag-card .info .name{font-family:'Space Grotesk';font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tag-card .info .meta{font-size:11px;color:var(--text-muted);margin-top:2px;}
  .tag-card .info .code{font-size:10px;color:var(--text-muted);margin-top:4px;letter-spacing:.03em;}
  .tag-card .qty{padding:10px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
  .tag-card .qty .n{font-family:'JetBrains Mono';font-weight:700;font-size:18px;}
  .tag-card .qty .n.zero{color:var(--danger);}
  .tag-card .qty .u{font-size:9px;color:var(--text-muted);text-transform:uppercase;}

  .search-bar{width:100%;padding:12px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:'Inter';font-size:14px;margin-bottom:14px;}
  .search-bar::placeholder{color:var(--text-muted);}
  .empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);}
  .empty-state .icon{font-size:32px;margin-bottom:8px;}

  /* History rows */
  .hist-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);}
  .hist-row .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .hist-row .dot.carico{background:var(--accent);} .hist-row .dot.scarico{background:var(--danger);}
  .hist-row .body{flex:1;min-width:0;}
  .hist-row .body .name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hist-row .body .date{font-size:11px;color:var(--text-muted);}
  .hist-row .amt{font-family:'JetBrains Mono';font-weight:700;font-size:13px;}
  .hist-row .amt.carico{color:var(--accent);} .hist-row .amt.scarico{color:var(--danger);}

  /* Bottom nav */
  nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:var(--surface);border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe-bottom);}
  nav button{flex:1;background:none;border:none;color:var(--text-muted);padding:12px 0 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:'Inter';font-size:11px;cursor:pointer;}
  nav button.active{color:var(--accent);}
  nav button .ic{font-size:18px;}

  /* Overlays / modals */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .overlay.active{display:flex;}
  .sheet{background:var(--surface);border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:20px 20px calc(24px + var(--safe-bottom));border-top:1px solid var(--border);}
  .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
  .sheet h2{font-size:16px;margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:6px;}
  .field input,.field select{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-family:'Inter';font-size:14px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .photo-input{display:flex;align-items:center;gap:12px;}
  .photo-preview{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--surface-2);flex-shrink:0;}
  .photo-btn{padding:10px 14px;border-radius:8px;border:1px dashed var(--border);background:none;color:var(--text-muted);font-size:13px;cursor:pointer;}

  .stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:18px 0;}
  .stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:20px;cursor:pointer;}
  .stepper .val{font-family:'JetBrains Mono';font-size:28px;font-weight:700;min-width:60px;text-align:center;}

  .btn{width:100%;padding:14px;border-radius:10px;border:none;font-family:'Space Grotesk';font-weight:600;font-size:15px;cursor:pointer;margin-top:6px;}
  .btn.primary.carico{background:var(--accent);color:#1C1B19;}
  .btn.primary.scarico{background:var(--danger);color:#F1EDE4;}
  .btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
  .btn.ghost{background:none;color:var(--danger);}

  .product-preview{display:flex;gap:12px;align-items:center;background:var(--surface-2);border-radius:10px;padding:12px;margin-bottom:16px;}
  .product-preview img,.product-preview .ph{width:52px;height:52px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text-muted);}
  .product-preview .pn{font-family:'Space Grotesk';font-weight:600;font-size:14px;}
  .product-preview .pm{font-size:11px;color:var(--text-muted);margin-top:2px;}

  /* Scanner overlay */
  #scanner-overlay{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column;}
  #scanner-overlay.active{display:flex;}
  #qr-reader{flex:1;}
  #qr-reader video{width:100%!important;height:100%!important;object-fit:cover;}
  .scanner-top{position:absolute;top:0;left:0;right:0;padding:16px;display:flex;justify-content:space-between;align-items:center;z-index:2;}
  .scanner-top .close-scan{background:rgba(0,0,0,.5);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;}
  .scanner-hint{position:absolute;bottom:40px;left:0;right:0;text-align:center;color:#fff;font-size:13px;z-index:2;}

  .toast{position:fixed;bottom:calc(80px + var(--safe-bottom));left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:999px;font-size:13px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;}
  .toast.show{opacity:1;}

  ::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="bars"><span></span><span></span><span></span><span></span><span></span></div>
    <div>
      <h1>Solaio</h1>
      <div class="sub">inventario dispensa</div>
    </div>
  </header>

  <main>
    <!-- SCAN VIEW -->
    <section class="view active" id="view-scan">
      <div class="scan-hero">
        <div class="mode-toggle">
          <button class="active carico" id="mode-carico" onclick="setMode('carico')">Carico</button>
          <button class="scarico" id="mode-scarico" onclick="setMode('scarico')">Scarico</button>
        </div>
        <button class="scan-btn carico" id="scan-btn" onclick="openScanner()">Scansiona codice a barre</button>
        <button class="manual-link" onclick="openManualEntry()">oppure aggiungi manualmente</button>
      </div>

      <div class="stats-row">
        <div class="stat-card"><div class="n mono" id="stat-products">-</div><div class="l">Prodotti</div></div>
        <div class="stat-card"><div class="n mono" id="stat-units">-</div><div class="l">Unità totali</div></div>
        <div class="stat-card"><div class="n mono" id="stat-low">-</div><div class="l">In esaurimento</div></div>
      </div>

      <div class="section-label">Ultimi movimenti</div>
      <div id="recent-list"></div>
    </section>

    <!-- INVENTORY VIEW -->
    <section class="view" id="view-inventory">
      <input class="search-bar" id="search-input" placeholder="Cerca prodotto, categoria, luogo..." oninput="renderInventory()">
      <div id="inventory-list"></div>
    </section>

    <!-- HISTORY VIEW -->
    <section class="view" id="view-history">
      <div id="history-list"></div>
    </section>
  </main>

  <nav>
    <button class="active" id="nav-scan" onclick="switchView('scan')"><span class="ic">▤</span>Scansiona</button>
    <button id="nav-inventory" onclick="switchView('inventory')"><span class="ic">▦</span>Inventario</button>
    <button id="nav-history" onclick="switchView('history')"><span class="ic">▥</span>Storico</button>
  </nav>

  <!-- Scanner fullscreen overlay -->
  <div id="scanner-overlay">
    <div class="scanner-top">
      <div class="mono" id="scanner-mode-label" style="color:#fff;font-size:12px;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:999px;"></div>
      <button class="close-scan" onclick="closeScanner()">✕</button>
    </div>
    <div id="qr-reader"></div>
    <div class="scanner-hint">Inquadra il codice a barre del prodotto</div>
  </div>

  <!-- Confirm movement sheet (existing product) -->
  <div class="overlay" id="confirm-overlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2 id="confirm-title">Conferma movimento</h2>
      <div class="product-preview" id="confirm-preview"></div>
      <div class="stepper">
        <button onclick="adjustQty(-1)">−</button>
        <div class="val mono" id="confirm-qty">1</div>
        <button onclick="adjustQty(1)">+</button>
      </div>
      <button class="btn primary" id="confirm-btn" onclick="confirmMovement()"></button>
      <button class="btn secondary" onclick="closeOverlay('confirm-overlay')">Annulla</button>
    </div>
  </div>

  <!-- New / edit product sheet -->
  <div class="overlay" id="product-overlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2 id="product-form-title">Nuovo prodotto</h2>
      <div class="field">
        <label>Nome prodotto *</label>
        <input id="f-name" placeholder="Es. Passata di pomodoro">
      </div>
      <div class="field-row">
        <div class="field"><label>Marca</label><input id="f-brand" placeholder="Es. Mutti"></div>
        <div class="field"><label>Categoria</label><input id="f-category" placeholder="Es. Conserve"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Luogo</label><input id="f-location" placeholder="Es. Solaio - scaffale 2"></div>
        <div class="field"><label>Unità</label><input id="f-unit" placeholder="pz" value="pz"></div>
      </div>
      <div class="field">
        <label>Quantità iniziale</label>
        <input id="f-qty" type="number" min="0" step="1" value="1">
      </div>
      <div class="field">
        <label>Foto</label>
        <div class="photo-input">
          <img class="photo-preview" id="f-photo-preview" style="display:none;">
          <div class="photo-preview" id="f-photo-ph">📦</div>
          <button class="photo-btn" onclick="document.getElementById('f-photo-file').click()">Scatta / carica foto</button>
          <input type="file" id="f-photo-file" accept="image/*" capture="environment" style="display:none" onchange="onPhotoSelected(event)">
        </div>
      </div>
      <div class="field mono" style="color:var(--text-muted);font-size:11px;" id="f-barcode-display"></div>
      <button class="btn primary carico" id="product-save-btn" onclick="saveProduct()">Salva prodotto</button>
      <button class="btn ghost" id="product-delete-btn" style="display:none" onclick="deleteProductConfirm()">Elimina prodotto</button>
      <button class="btn secondary" onclick="closeOverlay('product-overlay')">Annulla</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ====================== CONFIG ======================
   Sostituisci questi due valori con quelli del tuo progetto Supabase
   (Settings -> API -> Project URL / anon public key)                */
const SUPABASE_URL = 'https://kajjzcpvimcxgibjxony.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_MpnvnuqSji92G9JRP6u36Q_Jv4kx8iE';
/* ===================================================== */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let mode = 'carico'; // 'carico' | 'scarico'
let html5Qrcode = null;
let currentView = 'scan';

let pendingBarcode = null;
let pendingProduct = null; // existing product row, if found
let pendingQty = 1;

let editingProductId = null; // for the product form (new vs edit)
let pendingPhotoFile = null;

let allProducts = [];
let allMovements = [];

/* ---------------- Navigation ---------------- */
function switchView(view){
  currentView = view;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+view).classList.add('active');
  if(view==='inventory') renderInventory();
  if(view==='history') renderHistory();
  if(view==='scan') refreshStats();
}

function setMode(m){
  mode = m;
  document.getElementById('mode-carico').classList.toggle('active', m==='carico');
  document.getElementById('mode-scarico').classList.toggle('active', m==='scarico');
  const btn = document.getElementById('scan-btn');
  btn.textContent = m==='carico' ? 'Scansiona codice a barre' : 'Scansiona per scaricare';
  btn.className = 'scan-btn ' + m;
}

/* ---------------- Toast ---------------- */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------------- Scanner ---------------- */
function openScanner(){
  document.getElementById('scanner-mode-label').textContent = mode==='carico' ? 'CARICO' : 'SCARICO';
  document.getElementById('scanner-overlay').classList.add('active');
  html5Qrcode = new Html5Qrcode('qr-reader', { formatsToSupport: [
    Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.CODE_128
  ]});
  html5Qrcode.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 260, height: 140 } },
    onScanSuccess,
    ()=>{}
  ).catch(err=>{
    toast('Impossibile accedere alla fotocamera');
    closeScanner();
  });
}

function closeScanner(){
  document.getElementById('scanner-overlay').classList.remove('active');
  if(html5Qrcode){
    html5Qrcode.stop().then(()=>html5Qrcode.clear()).catch(()=>{});
    html5Qrcode = null;
  }
}

async function onScanSuccess(decodedText){
  closeScanner();
  await handleBarcode(decodedText);
}

/* ---------------- Barcode handling ---------------- */
async function handleBarcode(barcode){
  pendingBarcode = barcode;
  const { data, error } = await sb.from('products').select('*').eq('barcode', barcode).maybeSingle();
  if(error){ toast('Errore di connessione al database'); return; }

  if(data){
    pendingProduct = data;
    openConfirmSheet(data);
  } else {
    if(mode === 'scarico'){
      toast('Prodotto non trovato in inventario');
      return;
    }
    // Carico su prodotto nuovo: prova il lookup su Open Food Facts, poi apri il form
    toast('Nuovo prodotto: recupero informazioni...');
    let prefill = { name:'', brand:'', photo_url:'' };
    try{
      const r = await fetch('https://world.openfoodfacts.org/api/v0/product/'+encodeURIComponent(barcode)+'.json');
      const j = await r.json();
      if(j && j.status === 1 && j.product){
        prefill.name = j.product.product_name || j.product.generic_name || '';
        prefill.brand = j.product.brands || '';
        prefill.photo_url = j.product.image_front_small_url || j.product.image_url || '';
      }
    }catch(e){ /* nessun problema, si compila a mano */ }
    openProductForm(null, barcode, prefill);
  }
}

function openManualEntry(){
  pendingBarcode = null;
  openProductForm(null, null, {});
}

/* ---------------- Confirm movement (existing product) ---------------- */
function openConfirmSheet(product){
  pendingQty = 1;
  document.getElementById('confirm-title').textContent = mode==='carico' ? 'Carica prodotto' : 'Scarica prodotto';
  const prev = document.getElementById('confirm-preview');
  prev.innerHTML = `
    ${product.photo_url ? `<img src="${product.photo_url}">` : `<div class="ph">📦</div>`}
    <div>
      <div class="pn">${escapeHtml(product.name)}</div>
      <div class="pm">Giacenza attuale: <span class="mono">${fmtQty(product.quantity)} ${escapeHtml(product.unit||'pz')}</span></div>
    </div>`;
  document.getElementById('confirm-qty').textContent = pendingQty;
  const btn = document.getElementById('confirm-btn');
  btn.textContent = mode==='carico' ? 'Carica' : 'Scarica';
  btn.className = 'btn primary ' + mode;
  document.getElementById('confirm-overlay').classList.add('active');
}

function adjustQty(delta){
  pendingQty = Math.max(1, pendingQty + delta);
  document.getElementById('confirm-qty').textContent = pendingQty;
}

async function confirmMovement(){
  const product = pendingProduct;
  if(!product) return;
  let newQty = mode==='carico' ? Number(product.quantity) + pendingQty : Number(product.quantity) - pendingQty;
  if(newQty < 0) newQty = 0;

  const { error: e1 } = await sb.from('products').update({ quantity: newQty, updated_at: new Date().toISOString() }).eq('id', product.id);
  if(e1){ toast('Errore nel salvataggio'); return; }

  await sb.from('movements').insert({
    product_id: product.id, barcode: product.barcode, type: mode, quantity: pendingQty
  });

  toast(mode==='carico' ? `Caricato: ${pendingQty} ${product.unit||'pz'}` : `Scaricato: ${pendingQty} ${product.unit||'pz'}`);
  closeOverlay('confirm-overlay');
  await loadAll();
}

/* ---------------- Product form (new / edit) ---------------- */
function openProductForm(product, barcode, prefill){
  editingProductId = product ? product.id : null;
  pendingPhotoFile = null;
  document.getElementById('product-form-title').textContent = product ? 'Modifica prodotto' : 'Nuovo prodotto';
  document.getElementById('f-name').value = product?.name || prefill?.name || '';
  document.getElementById('f-brand').value = product?.brand || prefill?.brand || '';
  document.getElementById('f-category').value = product?.category || '';
  document.getElementById('f-location').value = product?.location || '';
  document.getElementById('f-unit').value = product?.unit || 'pz';
  document.getElementById('f-qty').value = product ? product.quantity : 1;
  const photoUrl = product?.photo_url || prefill?.photo_url || '';
  const prev = document.getElementById('f-photo-preview');
  const ph = document.getElementById('f-photo-ph');
  if(photoUrl){ prev.src = photoUrl; prev.style.display='block'; ph.style.display='none'; window._pendingPhotoUrl = photoUrl; }
  else { prev.style.display='none'; ph.style.display='flex'; window._pendingPhotoUrl = ''; }
  const bc = product?.barcode || barcode || '';
  document.getElementById('f-barcode-display').textContent = bc ? 'Codice a barre: ' + bc : 'Nessun codice a barre (voce manuale)';
  window._formBarcode = bc;
  document.getElementById('product-delete-btn').style.display = product ? 'block' : 'none';
  document.getElementById('product-save-btn').className = 'btn primary ' + mode;
  document.getElementById('product-overlay').classList.add('active');
}

function onPhotoSelected(evt){
  const file = evt.target.files[0];
  if(!file) return;
  pendingPhotoFile = file;
  const prev = document.getElementById('f-photo-preview');
  const ph = document.getElementById('f-photo-ph');
  prev.src = URL.createObjectURL(file);
  prev.style.display='block'; ph.style.display='none';
}

async function saveProduct(){
  const name = document.getElementById('f-name').value.trim();
  if(!name){ toast('Inserisci il nome del prodotto'); return; }
  const brand = document.getElementById('f-brand').value.trim();
  const category = document.getElementById('f-category').value.trim();
  const location = document.getElementById('f-location').value.trim();
  const unit = document.getElementById('f-unit').value.trim() || 'pz';
  const qty = Number(document.getElementById('f-qty').value) || 0;
  const barcode = window._formBarcode || null;

  let photoUrl = window._pendingPhotoUrl || null;
  if(pendingPhotoFile){
    const path = (barcode || 'manual-' + Date.now()) + '-' + Date.now() + '.jpg';
    const { data, error } = await sb.storage.from('product-photos').upload(path, pendingPhotoFile, { upsert: true });
    if(!error){
      const { data: pub } = sb.storage.from('product-photos').getPublicUrl(path);
      photoUrl = pub.publicUrl;
    }
  }

  const payload = { name, brand, category, location, unit, photo_url: photoUrl, barcode };

  if(editingProductId){
    const { error } = await sb.from('products').update({ ...payload, updated_at: new Date().toISOString() }).eq('id', editingProductId);
    if(error){ toast('Errore nel salvataggio'); return; }
    toast('Prodotto aggiornato');
  } else {
    payload.quantity = qty;
    const { error } = await sb.from('products').insert(payload).select().single();
    if(error){ toast(error.message.includes('duplicate') ? 'Codice a barre già presente' : 'Errore nel salvataggio'); return; }
    if(qty > 0){
      const { data: inserted } = await sb.from('products').select('*').eq('barcode', barcode).maybeSingle();
      if(inserted){
        await sb.from('movements').insert({ product_id: inserted.id, barcode, type: 'carico', quantity: qty });
      }
    }
    toast('Prodotto aggiunto alla dispensa');
  }

  closeOverlay('product-overlay');
  await loadAll();
}

function deleteProductConfirm(){
  if(!editingProductId) return;
  if(confirm('Eliminare definitivamente questo prodotto dall\\'inventario?')){
    deleteProduct(editingProductId);
  }
}

async function deleteProduct(id){
  await sb.from('products').delete().eq('id', id);
  toast('Prodotto eliminato');
  closeOverlay('product-overlay');
  await loadAll();
}

function closeOverlay(id){
  document.getElementById(id).classList.remove('active');
}

/* ---------------- Data loading & rendering ---------------- */
async function loadAll(){
  const [{ data: products }, { data: movements }] = await Promise.all([
    sb.from('products').select('*').order('name'),
    sb.from('movements').select('*, products(name, unit)').order('created_at', { ascending:false }).limit(200)
  ]);
  allProducts = products || [];
  allMovements = movements || [];
  refreshStats();
  if(currentView==='inventory') renderInventory();
  if(currentView==='history') renderHistory();
  renderRecent();
}

function refreshStats(){
  document.getElementById('stat-products').textContent = allProducts.length;
  const totalUnits = allProducts.reduce((s,p)=>s+Number(p.quantity||0),0);
  document.getElementById('stat-units').textContent = totalUnits;
  const low = allProducts.filter(p=>Number(p.quantity)<=1).length;
  document.getElementById('stat-low').textContent = low;
}

function renderRecent(){
  const el = document.getElementById('recent-list');
  const recent = allMovements.slice(0,5);
  if(recent.length===0){ el.innerHTML = `<div class="empty-state"><div class="icon">📭</div>Nessun movimento ancora</div>`; return; }
  el.innerHTML = recent.map(m=>histRowHtml(m)).join('');
}

function renderHistory(){
  const el = document.getElementById('history-list');
  if(allMovements.length===0){ el.innerHTML = `<div class="empty-state"><div class="icon">📭</div>Nessun movimento ancora</div>`; return; }
  el.innerHTML = allMovements.map(m=>histRowHtml(m)).join('');
}

function histRowHtml(m){
  const d = new Date(m.created_at);
  const dateStr = d.toLocaleDateString('it-IT',{day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  const pname = m.products?.name || '(prodotto eliminato)';
  return `<div class="hist-row">
    <div class="dot ${m.type}"></div>
    <div class="body"><div class="name">${escapeHtml(pname)}</div><div class="date">${dateStr}</div></div>
    <div class="amt ${m.type}">${m.type==='carico'?'+':'-'}${fmtQty(m.quantity)}</div>
  </div>`;
}

function renderInventory(){
  const q = (document.getElementById('search-input').value||'').toLowerCase();
  const el = document.getElementById('inventory-list');
  const filtered = allProducts.filter(p=>
    !q || p.name.toLowerCase().includes(q) || (p.category||'').toLowerCase().includes(q) || (p.location||'').toLowerCase().includes(q) || (p.brand||'').toLowerCase().includes(q)
  );
  if(filtered.length===0){ el.innerHTML = `<div class="empty-state"><div class="icon">📦</div>Nessun prodotto trovato</div>`; return; }
  el.innerHTML = filtered.map(p=>`
    <div class="tag-card" onclick='openProductForm(${JSON.stringify(p).replace(/'/g,"&#39;")})'>
      ${p.photo_url ? `<img class="photo" src="${p.photo_url}">` : `<div class="photo-ph">📦</div>`}
      <div class="divider"></div>
      <div class="info">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="meta">${escapeHtml([p.category,p.location].filter(Boolean).join(' · ')||'—')}</div>
        <div class="code mono">${p.barcode||'manuale'}</div>
      </div>
      <div class="qty">
        <div class="n mono ${Number(p.quantity)===0?'zero':''}">${fmtQty(p.quantity)}</div>
        <div class="u">${escapeHtml(p.unit||'pz')}</div>
      </div>
    </div>`).join('');
}

function fmtQty(q){ const n = Number(q); return Number.isInteger(n) ? n : n.toFixed(2); }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- Init ---------------- */
window.addEventListener('load', ()=>{
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  loadAll();
});
</script>
</body>
